name: Fetch ES/NQ bars

on:
  schedule:
    # every 30 min at :07/:37 (off-peak), 6 AM – 4:40 PM PT weekdays
    - cron: "7,37 13-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Download bars
        run: |
          python - <<'EOF'
          import yfinance as yf, pandas as pd, pathlib, time
          pathlib.Path("bars").mkdir(exist_ok=True)
          jobs = [("ES=F","ES","5m","7d"),("NQ=F","NQ","5m","7d"),
                  ("ES=F","ES","1h","60d"),("NQ=F","NQ","1h","60d")]
          for sym, name, iv, per in jobs:
              df = pd.DataFrame()
              for attempt in range(4):
                  df = yf.download(sym, period=per, interval=iv, progress=False,
                                   auto_adjust=False, prepost=True)
                  if not df.empty: break
                  time.sleep(15)
              if df.empty:
                  raise SystemExit(f"no data for {sym} {iv}")
              df.columns = [c[0] if isinstance(c, tuple) else c for c in df.columns]
              df = df[["Open","High","Low","Close","Volume"]]
              df.index = df.index.tz_convert("America/New_York")
              df.index.name = "time"
              df.to_csv(f"bars/{name}_{iv}.csv")
              print(name, iv, len(df), df.index[0], "->", df.index[-1])
          EOF
      - name: Commit
        run: |
          git config user.name "bars-bot"
          git config user.email "bars-bot@users.noreply.github.com"
          git add bars
          git diff --cached --quiet || git commit -m "bars $(date -u +%FT%H:%MZ)"
          git push
